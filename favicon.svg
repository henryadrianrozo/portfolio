<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Henry Adrian Rozo">
  <!-- The rainbow bar that runs across the top of every page, compressed into a
       dot. A single shape with pure color is the only thing that reliably
       survives 16px, which is why this and not a monogram.

       Full bleed with transparent corners on purpose: the orb then reads the
       same against light or dark browser chrome. The stops are the same seven
       used by .rainbow-bar in styles.css; keep them in sync. -->
  <defs>
    <linearGradient id="orb" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="17%" stop-color="#ff9500"/>
      <stop offset="33%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#34c759"/>
      <stop offset="67%" stop-color="#0a84ff"/>
      <stop offset="84%" stop-color="#5e5ce6"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#orb)"/>
</svg>
